plugins {
	// The non-remapping Loom plugin: Minecraft 26.1+ ships unobfuscated, so there are
	// no mappings and nothing to remap.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Hosts a patched build of Netty's incubator QUIC "classes" (API) jar that
	// e4mc (https://github.com/vgskye/e4mc-minecraft-architectury, MIT) depends
	// on for its relay tunnel. The native QUIC codec binaries themselves are the
	// unpatched upstream release, from Maven Central.
	maven { url 'https://maven.is-quite.gay/' }
	// Hosts discord-game-sdk4j (see dev.nexoclient.nexomod.discord), which isn't published to Maven Central.
	maven { url 'https://jitpack.io' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings dependency: Minecraft is unobfuscated from 26.1 onwards.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// LAN-over-internet tunnel (see dev.nexoclient.nexomod.lantunnel), adapted
	// from e4mc. QUIC transport for the tunnel to the relay.
	include(implementation("io.netty.incubator:netty-incubator-codec-classes-quic:${project.quic_version}") {
		exclude group: "io.netty"
	})
	// Bundle every platform's native QUIC codec so one built jar works on
	// Linux, Windows, and macOS — Netty's native loader auto-detects the
	// running OS/arch and picks the matching one at runtime, ignoring the
	// rest.
	["linux-x86_64", "linux-aarch_64", "windows-x86_64", "osx-x86_64", "osx-aarch_64"].each { classifier ->
		include(implementation("io.netty.incubator:netty-incubator-codec-native-quic:${project.quic_native_version}:${classifier}") {
			// The native artifact's own POM depends on the unforked classes-quic
			// at the plain version, which otherwise wins Gradle's conflict
			// resolution over our patched version above (same group:artifact,
			// "higher" version string) and silently swaps it out.
			exclude group: "io.netty.incubator", module: "netty-incubator-codec-classes-quic"
		})
	}
	include(implementation("io.netty:netty-all:${project.netty_version}"))

	// Discord Rich Presence (see dev.nexoclient.nexomod.discord) — a pure-Java
	// reimplementation of Discord's local RPC IPC protocol (MIT), used instead
	// of a hand-rolled socket client because it's already battle-tested by
	// other real Fabric mods (e.g. Phase's Discord Rich Presence,
	// https://github.com/ThePhaseCat/phases-discord-rich-presence, which
	// depends on this same library, on this same MC/loader combo). Pinned to
	// the v1.0.0 tag rather than Phase's exact commit since that commit isn't
	// pre-built on JitPack (would need to trigger + wait on a fresh build);
	// v1.0.0's CHANGELOG covers the same "pure Java, no native lib, button
	// support" rewrite this mod relies on.
	include(implementation("com.github.JnCrMx:discord-game-sdk4j:v1.0.0") {
		// Minecraft/Fabric Loader already ships Gson on the runtime classpath;
		// bundling a second copy risks a classpath conflict for no benefit.
		exclude group: "com.google.code.gson", module: "gson"
	})
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
